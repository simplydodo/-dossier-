<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIDENTIAL DOSSIER: ROMANTIC PROTOCOL</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121318;
            --accent-color: #e63946;
            --text-main: #e0e6ed;
            --text-muted: #7a889b;
            --border-color: #232733;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            gap: 20px;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Photo Upload Styling */
        .photo-upload-box {
            width: 130px;
            height: 150px;
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background-color: #060608;
            flex-shrink: 0;
        }

        .photo-upload-box input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .photo-upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 5px;
        }

        .section-title {
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #1a1d26;
            padding-bottom: 5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #060608;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Checkbox Styling */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-main);
            background-color: #060608;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            margin-top: 25px;
        }

        button:hover {
            background-color: #c92a37;
        }

        @media (max-width: 600px) {
            .header-flex {
                flex-direction: column-reverse;
                align-items: center;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div>
            <span class="badge">RESTRICTED ACCESS</span>
            <h1>CLASSIFIED DOSSIER</h1>
            <div class="subtitle" id="dossierSubtitle">LOADING PROTOCOL...</div>
        </div>
        <div class="photo-upload-box" id="photoBox">
            <span class="photo-text">📍 Place photo of yourself here</span>
            <img id="preview" src="" alt="Profile Photo">
            <input type="file" accept="image/*" onchange="previewImage(event)">
        </div>
    </div>

    <form id="dossierForm">
        <div class="section-title">1. [AGENT IDENTIFICATION]</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Codename / Real Name</label>
                <input type="text" placeholder="Enter name or codename..." required>
            </div>
            <div class="form-group">
                <label>Nickname You Secretly Love</label>
                <input type="text" placeholder="What should I call you?">
            </div>
        </div>

        <div class="section-title">2. [OPERATIONAL PREFERENCES]</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Top 3 Go-To Songs</label>
                <input type="text" placeholder="1... 2... 3...">
            </div>
            <div class="form-group">
                <label>Top Comfort Movies/Shows</label>
                <input type="text" placeholder="What do we binge together?">
            </div>
        </div>

        <div class="section-title">3. [STRATEGIC ENGAGEMENT & ROMANCE DIRECTIVES]</div>
        <label>Tick all directives you agree to execute with me:</label>
        <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox"> Surprise midnight dates</label>
            <label class="checkbox-item"><input type="checkbox"> Pinned against the wall looks</label>
            <label class="checkbox-item"><input type="checkbox"> Late-night whispered secrets</label>
            <label class="checkbox-item"><input type="checkbox"> Unexpected tight hugs from behind</label>
            <label class="checkbox-item"><input type="checkbox"> Being completely goofy in public</label>
            <label class="checkbox-item"><input type="checkbox"> Spontaneous weekend getaways</label>
            <label class="checkbox-item"><input type="checkbox"> Hand-written romantic letters</label>
            <label class="checkbox-item"><input type="checkbox"> Forehead kisses when tired</label>
        </div>

        <div class="section-title">4. [DEEP PERSONAL INTELLIGENCE]</div>
        <div class="form-group">
            <label>1. What is a secret dream you've never told anyone?</label>
            <textarea rows="2" placeholder="Tell me what nobody else knows..."></textarea>
        </div>
        <div class="form-group">
            <label>2. How do you want to be treated when you are silently sad?</label>
            <textarea rows="2" placeholder="Do you want space, hugs, or food?"></textarea>
        </div>
        <div class="form-group">
            <label>3. What is your ultimate unspoken romantic fantasy?</label>
            <textarea rows="2" placeholder="Don't be shy, this is classified..."></textarea>
        </div>
        <div class="form-group">
            <label>4. Describe the exact moment or vibe that makes your heart skip a beat.</label>
            <textarea rows="2" placeholder="What turns on your butterflies instantly?"></textarea>
        </div>

        <div class="section-title">5. [PHYSICAL & EMOTIONAL BOUNDARIES]</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Cuddling Stance</label>
                <select>
                    <option>Big Spoon</option>
                    <option>Little Spoon</option>
                    <option>Both Interlocked</option>
                </select>
            </div>
            <div class="form-group">
                <label>Public Display of Affection (PDA)</label>
                <select>
                    <option>Discreet & Subtle</option>
                    <option>Full-On Hand Holding & Kisses</option>
                    <option>Private Only</option>
                </select>
            </div>
        </div>

        <button type="button" onclick="submitDossier()">TRANSMIT DOSSIER - ACTIVATE PROTOCOL 🖤</button>
    </form>
</div>

<script>
    // ============================================================
    // YAHAN APNA NAAM YA BHAI KI BANDI KA NAAM AUR PROTOCOL CHANGE KARO
    // ============================================================
    const SUBJECT_NAME = "SHREE";        // <--- Partner Name (e.g. SHREE)
    const PROTOCOL_CODENAME = "SOULMATE"; // <--- Protocol Name (e.g. VIGIL / SOULMATE / FOREVER)
    // ============================================================

    // Header updates automatically
    document.getElementById("dossierSubtitle").innerText = 
        `SUBJECT: ${SUBJECT_NAME.toUpperCase()} | PROTOCOL: ${PROTOCOL_CODENAME.toUpperCase()}`;

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'block';
            document.querySelector('.photo-text').style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function submitDossier() {
        alert(`TRANSMISSION COMPLETE.\n\nResponses for ${SUBJECT_NAME} have been securely logged. Expect romantic contact soon. 💗✨`);
    }
</script>

</body>
</html>
