<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIDENTIAL DOSSIER: PROJECT VIGIL</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121318;
            --accent-color: #e63946;
            --text-main: #e0e6ed;
            --text-muted: #7a889b;
            --border-color: #232733;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            background-color: #060608;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button:hover {
            background-color: #c92a37;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">RESTRICTED ACCESS</span>
        <h1>CLASSIFIED DOSSIER</h1>
        <div class="subtitle">SUBJECT: SHREE | PROTOCOL: VIGIL</div>
    </div>

    <form id="dossierForm">
        <div class="form-group">
            <label>1. Current Mood / Status Protocol</label>
            <input type="text" placeholder="Specify current state..." required>
        </div>

        <div class="form-group">
            <label>2. Primary Love Language Preference</label>
            <select required>
                <option value="" disabled selected>Select Primary Directive</option>
                <option value="words">Words of Affirmation</option>
                <option value="time">Quality Time</option>
                <option value="gifts">Receiving Gifts</option>
                <option value="service">Acts of Service</option>
                <option value="touch">Physical Touch</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. Desired Romantic Dynamic / Mission Directive</label>
            <textarea rows="3" placeholder="State operational expectations..."></textarea>
        </div>

        <div class="form-group">
            <label>4. Confidential Personal Preference / Special Request</label>
            <textarea rows="3" placeholder="Classified details..."></textarea>
        </div>

        <button type="button" onclick="alert('Dossier Transmitted Successfully.')">TRANSMIT DOSSIER</button>
    </form>
</div>

</body>
</html>
